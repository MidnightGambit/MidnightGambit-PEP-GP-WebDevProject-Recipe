<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients - Recipe Management App</title>
    <link rel="stylesheet" href="ingredient-page.css">
</head>
<body>

    <!-- Back link to Recipes page -->
    <a href="recipes.html" id="back-link">← Back to Recipes</a>

    <h1>Manage Ingredients</h1>

    <!-- Ingredients List Section -->
    <section>
        <h2>Ingredients</h2>
        <ul id="ingredient-list"></ul>
    </section>

    <!-- Add Ingredient Section -->
    <section>
        <h2>Add an Ingredient</h2>
        <input type="text" 
               id="add-ingredient-name-input" 
               placeholder="Enter ingredient name">
        <button id="add-ingredient-submit-button">Add Ingredient</button>
    </section>

    <!-- Delete Ingredient Section -->
    <section>
        <h2>Delete an Ingredient</h2>
        <input type="text" 
               id="delete-ingredient-name-input" 
               placeholder="Enter ingredient name to delete">
        <button id="delete-ingredient-submit-button">Delete Ingredient</button>
    </section>

    <script src="ingredient-page.js"></script>
</body>
</html>

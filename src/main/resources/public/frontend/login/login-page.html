<!-- 
 This file contains the structure for the login page of the Recipe Management Application.
 It provides a form for users to enter their credentials and log into the system.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Recipe Management App</title>
    <link rel="stylesheet" href="login-page.css">   <!-- Optional: we'll create this later if you want -->
</head>
<body>

    <h1>Login</h1>

    <!-- Username Input -->
    <input type="text" 
           id="username-input" 
           placeholder="Enter your username">

    <!-- Password Input -->
    <input type="password" 
           id="password-input" 
           placeholder="Enter your password">

    <!-- Login Button -->
    <button id="login-button">Login</button>

    <!-- Optional Logout Button (hidden by default) -->
    <button id="logout-button" style="display: none;">Logout</button>

    <script src="login-page.js"></script>
</body>
</html>
